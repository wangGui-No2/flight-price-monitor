name: 机票价格日报

on:
  schedule:
    # 北京时间 9:00 / 14:00 / 20:00 (UTC+8)
    - cron: "0 1,6,12 * * *"
  workflow_dispatch:

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 查询机票价格并推送飞书日报
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python check_flight.py
